# Gitleaks Configuration for AgentWindTunnel
title = "AgentWindTunnel Secret Scanner"

[extend]
useDefault = true

[allowlist]
description = "Allowed placeholder tokens and documentation patterns"
paths = [
    '''\.env\.example''',
    '''README\.md''',
    '''docs/.*'''
]
regexes = [
    '''your_gemini_api_key_here''',
    '''your_openai_api_key_here'''
]
